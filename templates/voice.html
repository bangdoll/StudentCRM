<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學員管理語音工作台</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <p class="section-kicker">語音營運入口</p>
        <h1>學員管理語音工作台</h1>
        <p class="meta-info">同步來源：{{ sync_status.engine }} · {{ sync_status.source }}</p>
    </header>

    <main class="container voice-page">
        <nav class="program-toolbar" aria-label="頁面操作">
            <a href="{{ request.url_for('read_dashboard') }}" class="program-nav-button program-nav-button-primary">返回學員看板</a>
            <a href="{{ request.url_for('read_apple_ceo_program') }}" class="program-nav-button program-nav-button-secondary">蘋果總裁班</a>
        </nav>

        <section class="voice-hero panel-card">
            <div>
                <p class="section-kicker">三階段同時啟用</p>
                <h2>先口述，再確認，最後才寫入。</h2>
                <p class="meta-info">課後紀錄可在確認後寫入 Supabase；查詢、訊息發送與行事曆仍只產生草稿。</p>
            </div>
            <div class="voice-mode-grid">
                <button class="voice-mode-button active" data-mode="draft" type="button">課後紀錄</button>
                <button class="voice-mode-button" data-mode="query" type="button">查詢資料</button>
                <button class="voice-mode-button" data-mode="workflow" type="button">建立待辦</button>
            </div>
        </section>

        <section class="voice-console-grid">
            <article class="panel-card">
                <div class="panel-header">
                    <div>
                        <p class="section-kicker">輸入</p>
                        <h2 id="voiceModeTitle">課後紀錄草稿</h2>
                    </div>
                    <span class="tag tag-danger">需確認後寫入</span>
                </div>

                <div class="voice-recorder">
                    <button id="voiceRecordButton" class="voice-record-button" type="button">開始聽寫</button>
                    <span id="voiceRecordStatus" class="meta-info">可使用鍵盤輸入；支援的瀏覽器可直接聽寫。</span>
                </div>

                <label class="attendance-preview-field voice-input-field">
                    <span>口述內容</span>
                    <textarea id="voiceTranscript" rows="9" placeholder="例如：今天 Shelley 上第 14 堂，練了條件句和口說，下次 5 月 14 複習 because 和 although。"></textarea>
                </label>

                <div class="voice-example-list">
                    <button type="button" data-example="今天 Shelley 陳萱伶上第 14 堂，練了條件句和口說，下次 5 月 14 複習 because 和 although。">課後紀錄範例</button>
                    <button type="button" data-example="查米下一堂什麼時候？">查詢範例</button>
                    <button type="button" data-example="提醒我明天早上問 Kelly 要不要續班。">待辦範例</button>
                </div>

                <div class="attendance-preview-actions">
                    <button id="voiceSubmitButton" class="attendance-preview-button" type="button">產生結果</button>
                    <span class="meta-info">送出後只會產生預覽，不會寫入資料庫。</span>
                </div>
            </article>

            <article class="panel-card voice-result-panel">
                <p class="section-kicker">結果</p>
                <h2>確認面板</h2>
                <div id="voiceResult" class="voice-result-box">
                    <p class="meta-info">請輸入口述內容後產生結果。</p>
                </div>
                <div class="voice-commit-actions">
                    <button id="voiceCommitButton" class="attendance-preview-button voice-commit-button" type="button" disabled>確認寫入資料庫</button>
                    <span id="voiceCommitStatus" class="meta-info">只有課後紀錄草稿可寫入。</span>
                </div>
            </article>
        </section>
    </main>

    <script>
        const modeButtons = Array.from(document.querySelectorAll('.voice-mode-button'));
        const title = document.getElementById('voiceModeTitle');
        const transcript = document.getElementById('voiceTranscript');
        const submitButton = document.getElementById('voiceSubmitButton');
        const resultBox = document.getElementById('voiceResult');
        const commitButton = document.getElementById('voiceCommitButton');
        const commitStatus = document.getElementById('voiceCommitStatus');
        const recordButton = document.getElementById('voiceRecordButton');
        const recordStatus = document.getElementById('voiceRecordStatus');
        let mode = 'draft';
        let recognition = null;
        let recording = false;
        let latestDraft = null;

        const modeCopy = {
            draft: '課後紀錄草稿',
            query: '語音查詢',
            workflow: '待辦與工作流草稿',
        };

        function setMode(nextMode) {
            mode = nextMode;
            title.textContent = modeCopy[mode];
            modeButtons.forEach((button) => button.classList.toggle('active', button.dataset.mode === mode));
        }

        function renderJson(payload) {
            resultBox.innerHTML = `<pre>${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
        }

        function resetCommitState() {
            latestDraft = null;
            commitButton.disabled = true;
            commitStatus.textContent = '只有課後紀錄草稿可寫入。';
        }

        function escapeHtml(value) {
            return value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function endpointForMode() {
            if (mode === 'query') return '/api/voice/query';
            if (mode === 'workflow') return '/api/voice/workflow';
            return '/api/voice/draft';
        }

        function payloadForMode(text) {
            if (mode === 'query') return { query: text };
            return { transcript: text, source: 'browser' };
        }

        modeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                setMode(button.dataset.mode);
                resetCommitState();
            });
        });

        document.querySelectorAll('[data-example]').forEach((button) => {
            button.addEventListener('click', () => {
                transcript.value = button.dataset.example;
            });
        });

        submitButton.addEventListener('click', async () => {
            const text = transcript.value.trim();
            if (!text) {
                resultBox.innerHTML = '<p class="attendance-preview-warning">請先輸入口述內容。</p>';
                return;
            }
            resultBox.innerHTML = '<p class="meta-info">正在產生結果...</p>';
            resetCommitState();
            try {
                const response = await fetch(endpointForMode(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadForMode(text)),
                });
                const payload = await response.json();
                renderJson(payload);
                if (mode === 'draft' && payload.draft && payload.draft.matched_student && payload.draft.matched_student.id) {
                    latestDraft = payload.draft;
                    commitButton.disabled = false;
                    commitStatus.textContent = '請確認右側差異無誤後再寫入。';
                } else if (mode === 'draft') {
                    commitStatus.textContent = '尚未辨識出學員，不能寫入。';
                }
            } catch (error) {
                resultBox.innerHTML = `<p class="attendance-preview-warning">產生失敗：${escapeHtml(String(error))}</p>`;
            }
        });

        commitButton.addEventListener('click', async () => {
            if (!latestDraft) return;
            const studentName = latestDraft.matched_student?.name || '此學員';
            const confirmed = window.confirm(`確認要把 ${studentName} 的課後紀錄寫入資料庫嗎？`);
            if (!confirmed) return;
            commitButton.disabled = true;
            commitStatus.textContent = '正在寫入資料庫...';
            try {
                const response = await fetch('/api/voice/commit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ draft: latestDraft }),
                });
                const payload = await response.json();
                renderJson(payload);
                commitStatus.textContent = payload.status === 'written' ? '已寫入資料庫。' : `未寫入：${payload.reason || payload.status}`;
            } catch (error) {
                commitStatus.textContent = `寫入失敗：${String(error)}`;
            }
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.onresult = (event) => {
                let finalText = '';
                let interimText = '';
                for (let i = event.resultIndex; i < event.results.length; i += 1) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) finalText += text;
                    else interimText += text;
                }
                if (finalText) transcript.value = `${transcript.value}${finalText}`;
                recordStatus.textContent = interimText ? `辨識中：${interimText}` : '正在聽寫...';
            };
            recognition.onend = () => {
                recording = false;
                recordButton.textContent = '開始聽寫';
                recordStatus.textContent = '聽寫已停止。';
            };
        } else {
            recordButton.disabled = true;
            recordStatus.textContent = '此瀏覽器不支援即時聽寫，請改用鍵盤輸入。';
        }

        recordButton.addEventListener('click', () => {
            if (!recognition) return;
            if (recording) {
                recognition.stop();
                return;
            }
            recording = true;
            recordButton.textContent = '停止聽寫';
            recordStatus.textContent = '正在聽寫...';
            recognition.start();
        });
    </script>
</body>
</html>
