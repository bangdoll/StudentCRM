<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2.5" />

  <!-- Background Ambient Glow -->
  <circle cx="60" cy="60" r="32" fill="#58a6ff" opacity="0.12" filter="url(#glow)" />

  <!-- Shield / Lattice Outline -->
  <path d="M 60 24 L 88 38 L 88 72 L 60 94 L 32 72 L 32 38 Z" fill="none" stroke="url(#neonGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Interconnected Neural Lattice Lines -->
  <g stroke="url(#neonGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Top Leaf/Sprout -->
    <path d="M 60 30 Q 68 25 72 33 Q 66 38 60 30 Z" fill="url(#neonGradient)" />
    
    <!-- Neural Apple Contour & Inner Net -->
    <path d="M 60 44 C 52 38 40 40 40 54 C 40 70 54 80 60 84 C 66 80 80 70 80 54 C 80 40 68 38 60 44 Z" fill="none" stroke-width="2.8" />
    
    <!-- Inner Neural Connections -->
    <line x1="40" y1="54" x2="60" y2="62" />
    <line x1="80" y1="54" x2="60" y2="62" />
    <line x1="60" y1="44" x2="60" y2="62" />
    <line x1="60" y1="62" x2="60" y2="84" />
    <line x1="40" y1="54" x2="52" y2="76" />
    <line x1="80" y1="54" x2="68" y2="76" />
    <line x1="52" y1="76" x2="60" y2="84" />
    <line x1="68" y1="76" x2="60" y2="84" />

    <!-- External Lattice Anchors -->
    <line x1="32" y1="38" x2="40" y2="54" opacity="0.7" />
    <line x1="88" y1="38" x2="80" y2="54" opacity="0.7" />
    <line x1="32" y1="72" x2="52" y2="76" opacity="0.7" />
    <line x1="88" y1="72" x2="68" y2="76" opacity="0.7" />
  </g>

  <!-- Neural Data Nodes (Glowing Points) -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="60" cy="44" r="2.5" />
    <circle cx="40" cy="54" r="2.5" />
    <circle cx="80" cy="54" r="2.5" />
    <circle cx="60" cy="62" r="3.2" fill="#79c0ff" />
    <circle cx="52" cy="76" r="2.5" />
    <circle cx="68" cy="76" r="2.5" />
    <circle cx="60" cy="84" r="2.8" fill="#bc8cff" />
    
    <!-- Corner Nodes -->
    <circle cx="60" cy="24" r="2" fill="#58a6ff" />
    <circle cx="88" cy="38" r="2" fill="#58a6ff" />
    <circle cx="88" cy="72" r="2" fill="#bc8cff" />
    <circle cx="60" cy="94" r="2.5" fill="#bc8cff" />
    <circle cx="32" cy="72" r="2" fill="#bc8cff" />
    <circle cx="32" cy="38" r="2" fill="#58a6ff" />
  </g>
</svg>
