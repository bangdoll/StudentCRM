[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studentcrm"
version = "0.2.0"
description = "StudentCRM 雲端雙引擎學員管理系統"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.8",
    "jinja2>=3.1.0",
    "markdown>=3.9",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
]

# The server retains its legacy top-level imports (uvicorn main:app).
# Explicit discovery prevents NativeApp, tests and runtime caches from becoming
# accidental packages. Resource namespaces keep assets beside main.py in wheels.
[tool.setuptools]
py-modules = [
    "apple_ceo_service", "auth_service", "data_gateway",
    "digital_management_service", "fallback_views", "hub_service",
    "image_sync_engine", "main", "media_asset_resolver", "note_service", "asset_audit", "merge_students",
    "outcome_service", "prediction_service", "radar_service", "schedule_service",
    "student_profile_assembler", "student_service", "student_timeline_service",
    "teaching_reads", "teaching_sync", "teaching_sync_pipeline",
]
packages = ["routers", "schemas", "data", "static", "templates"]
include-package-data = false

[tool.setuptools.package-data]
data = ["*.json"]
static = ["*.css", "*.js", "*.svg", "*.png", "*.ico", "*.webmanifest", "teaching_assets/*.png", "teaching_assets/*.jpg", "teaching_assets/*.jpeg", "teaching_assets/*.webp"]
templates = ["*.html"]
