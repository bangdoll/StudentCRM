[project]
name = "studentcrm"
version = "0.2.0"
description = "StudentCRM 雲端雙引擎學員管理系統"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.8",
    "jinja2>=3.1.0",
    "markdown>=3.9",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
]
