name: CI Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ''
      SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Execute Pytest Suite
        run: |
          python -m pytest tests/ -v --junitxml=full-suite.xml
          python scripts/check_test_report.py full-suite.xml

      - name: Build source distribution and wheel
        run: python -m build

      - name: Install wheel in a fresh environment outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/studentcrm-wheel"
          "$RUNNER_TEMP/studentcrm-wheel/bin/python" -m pip install dist/*.whl httpx
          "$RUNNER_TEMP/studentcrm-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/studentcrm-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
